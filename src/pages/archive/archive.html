<main>
  <section class="archive" aria-labelledby="archive-title">
    <h1 id="archive-title" class="visually-hidden">Project archive</h1>

    <div class="archive__toolbar">
      <div class="archive__filters" id="archive-filters" role="group" aria-label="Filter projects by category"></div>

      <div class="archive__views" role="group" aria-label="View mode">
        <button type="button" class="view-toggle view-toggle--list" data-view="list" aria-pressed="false">
          <span class="visually-hidden">List view</span>
        </button>
        <button type="button" class="view-toggle view-toggle--grid" data-view="grid" aria-pressed="false">
          <span class="visually-hidden">Grid view</span>
        </button>
      </div>
    </div>

    <p class="visually-hidden" id="archive-status" aria-live="polite"></p>

    <ul class="archive__projects" id="archive-projects"></ul>
  </section>

  <div class="cursor-preview" aria-hidden="true">
    <img class="cursor-preview__image" alt="" width="452" height="288" decoding="async">
  </div>
</main>
