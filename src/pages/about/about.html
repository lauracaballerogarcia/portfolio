<!--
  about.html template: only the content of the main element is used.
  main.js imports it with bundle-text: and copies that content into the
  main of index.html, the only real document. The page title is set by
  the page JS; the shared metadata lives in index.html.

  This template only holds the structure. The content (profiles, photo,
  intro and sections) lives in src/data/about.json and about.js renders it.
-->
<main>
  <div class="about">

    <h1 class="visually-hidden">About</h1>

    <!-- Profile selector: about.js fills it and shows it only when
         there is more than one profile with content -->
    <div class="about__profiles" id="about-profiles" role="group" aria-label="View profile" hidden></div>

    <!-- Two-row grid: photo and intro on top; index and sections below,
         so the index and the first section start at the same height.
         The DOM order is the reading order and the mobile order -->
    <div class="about__layout">
      <div class="about__media" id="about-image"></div>
      <div class="about__intro" id="about-intro"></div>
      <nav class="section-index about__index" id="about-index" aria-label="About sections"></nav>
      <div class="about__sections" id="about-sections"></div>
    </div>

  </div>

  </main>
